<style>
.conversation-row{display:flex;align-items:center;gap:2px}.conversation-row .recent{flex:1;min-width:0}.conversation-row .recent[aria-current=true]{color:#fff;background:#ffffff18}.recent-delete{flex:none;width:28px;height:28px;padding:0;border:0;border-radius:5px;color:#a9c0b4;background:transparent;font-size:16px;line-height:1}.recent-delete:hover{color:#fff;background:#ffffff20}.recent-delete:focus-visible{outline:2px solid var(--lime);outline-offset:1px}

<body>
<div class="shell">
<aside id="sidebar" class="side">
  <div class="brand"><div class="mark" aria-hidden="true"></div><div class="brand-name">AL-MAJARRAT<span class="brand-sub">KNOWLEDGE DESK</span></div></div>
  <section class="library" aria-label="Indexed library"><div class="library-title"><span>Indexed library</span><span id="library-dot" class="dot"></span></div><div class="stats"><div class="stat"><strong id="hadith-count">--</strong><span>Hadith records</span></div><div class="stat"><strong id="verse-count">--</strong><span>Quran verses</span></div></div></section>
  <section class="recents" aria-label="Conversation history"><div class="side-label">Recent conversations</div><div id="recent-list" class="recent-list"></div></section>
  <div class="side-bottom"><div class="local"><span class="dot"></span><span>Local workspace</span></div><small>AL-MAJARRAT RESEARCH DESK</small></div>
</aside>
<button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation" hidden></button>
<main class="main">
  <header class="top"><button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Open conversation history" aria-controls="sidebar" aria-expanded="false">☰</button><div class="crumb">Library <span aria-hidden="true">/</span> <b>Research</b></div><div class="status-row" aria-live="polite"><div id="db-status" class="chip"><span class="dot"></span><span>Checking database</span></div><div id="ollama-status" class="chip"><span class="dot"></span><span>Checking Ollama</span></div></div></header>
  <div class="content">
    <section class="heading"><div><p class="eyebrow">Research desk <span aria-hidden="true">·</span> Local RAG</p><h1>Ask with evidence.</h1></div><div class="heading-meta"><span>Qwen 2.5 · 3B</span><span class="sep"></span><span>Hybrid retrieval</span></div></section>
    <form id="ask-form" class="composer"><label class="sr-only" for="question">Your question</label><textarea id="question" class="question" maxlength="2000" placeholder="Ask a question about the Quran or Hadith…" required></textarea><div class="composer-foot"><div class="modes" role="group" aria-label="Source selection"><button class="mode" type="button" data-mode="all" aria-pressed="true">All sources</button><button class="mode" type="button" data-mode="quran" aria-pressed="false">Quran</button><button class="mode" type="button" data-mode="hadith" aria-pressed="false">Hadith</button></div><button id="ask" class="ask" type="submit"><span>Ask</span><span class="arrow" aria-hidden="true">↗</span></button></div></form>
    <section class="suggestions" aria-label="Suggested questions"><p class="suggestion-label">Explore a question</p><div class="suggestion-row"><button class="suggestion" type="button" data-prompt="What does the Quran say about patience?">Patience</button><button class="suggestion" type="button" data-prompt="What is the Hadith about intentions?">Intentions</button><button class="suggestion" type="button" data-prompt="2:255">2:255</button><button class="suggestion" type="button" data-prompt="What guidance is there about charity?">Charity</button></div></section>
    <section id="result" class="result" aria-live="polite" hidden></section>
  </div>
</main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
(() => {
  const form=document.getElementById('ask-form'), input=document.getElementById('question'), submit=document.getElementById('ask'), result=document.getElementById('result'), recents=document.getElementById('recent-list'), toast=document.getElementById('toast'), sidebar=document.getElementById('sidebar'), sidebarToggle=document.getElementById('sidebar-toggle'), sidebarBackdrop=document.getElementById('sidebar-backdrop'), compactLayout=window.matchMedia('(max-width: 800px)');
  const historyKey='majarrat.recent-questions'; let mode='all',toastTimer,activeConversationId=null,historyUnavailable=false;
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function notify(message){toast.textContent=message;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,2200)}
  function setSidebarOpen(open){sidebar.classList.toggle('is-open',open);sidebar.inert=compactLayout.matches&&!open;sidebarToggle.setAttribute('aria-expanded',String(open));sidebarToggle.setAttribute('aria-label',open?'Close conversation history':'Open conversation history');sidebarBackdrop.hidden=!open}
  function chip(el,label,ready){el.classList.remove('ready','offline');if(ready===true)el.classList.add('ready');if(ready===false)el.classList.add('offline');el.lastElementChild.textContent=label}
  async function status(){try{const r=await fetch('/api/status',{cache:'no-store'}),s=await r.json(),d=s.database||{},o=s.ollama||{};chip(document.getElementById('db-status'),d.ready?'Database ready':'Database unavailable',d.ready);chip(document.getElementById('ollama-status'),o.ready?(o.chat_model_available?'Qwen online':'Ollama online'):'Ollama offline',o.ready);document.getElementById('hadith-count').textContent=Number(d.hadiths||0).toLocaleString();document.getElementById('verse-count').textContent=Number(d.verses||0).toLocaleString();document.getElementById('library-dot').style.background=d.ready?'var(--lime)':'var(--coral)'}catch(_){chip(document.getElementById('db-status'),'Server unavailable',false);chip(document.getElementById('ollama-status'),'Ollama status unknown',false)}}
  function getHistory(){try{const raw=localStorage.getItem(historyKey);if(!raw)return [];const saved=JSON.parse(raw);if(!Array.isArray(saved))throw new Error('Conversation history has an invalid format.');if(saved.every(item=>typeof item==='string')){const migrated=saved.map((query,index)=>({id:`legacy-${Date.now()}-${index}`,query,answer:'This question was saved before conversation history was enabled, so its response is not available.',quran:[],hadith:[],generated:false,legacy:true}));localStorage.setItem(historyKey,JSON.stringify(migrated));return migrated}return saved.filter(item=>item&&typeof item.id==='string'&&typeof item.query==='string')}catch(error){historyUnavailable=true;return []}}
  function renderHistory(){const items=getHistory();recents.replaceChildren();if(!items.length){const empty=document.createElement('div');empty.className='recent-empty';empty.textContent=historyUnavailable?'Conversation history is unavailable':'No conversations yet';recents.append(empty);return}items.forEach(item=>{const row=document.createElement('div'),open=document.createElement('button'),remove=document.createElement('button');row.className='conversation-row';open.className='recent';open.type='button';open.textContent=item.query;open.title=item.query;if(item.id===activeConversationId)open.setAttribute('aria-current','true');open.onclick=()=>{activeConversationId=item.id;input.value=item.query;mode=item.mode||'all';document.querySelectorAll('.mode').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===mode)));render(item);result.scrollIntoView({behavior:'smooth',block:'start'});renderHistory();if(compactLayout.matches)setSidebarOpen(false)};remove.className='recent-delete';remove.type='button';remove.textContent='×';remove.title='Delete conversation';remove.setAttribute('aria-label',`Delete conversation: ${item.query}`);remove.onclick=()=>deleteConversation(item.id);row.append(open,remove);recents.append(row)})}
  function persistHistory(items){try{localStorage.setItem(historyKey,JSON.stringify(items));historyUnavailable=false;return true}catch(_){historyUnavailable=true;notify('Conversation could not be saved. Browser storage may be full or unavailable.');renderHistory();return false}}
  function saveConversation(data){const items=getHistory();items.unshift({...data,id:`${Date.now()}-${Math.random().toString(36).slice(2)}`,createdAt:new Date().toISOString()});activeConversationId=items[0].id;if(persistHistory(items))renderHistory()}
  function deleteConversation(id){const items=getHistory().filter(item=>item.id!==id);if(!persistHistory(items))return;if(activeConversationId===id){activeConversationId=null;result.replaceChildren();result.hidden=true}renderHistory()}
  function answerMarkup(answer){return esc(answer||'No answer was returned.').replace(/\[([^\]]+)\]/g,'<span class="citation">[$1]</span>').split(/\n{2,}/).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('')}
  function readSource(raw,type){const lines=String(raw).split('\n').map(x=>x.trim()).filter(Boolean),first=(lines.shift()||'').replace(/^[•\-]\s*/,''),m=first.match(/^\[([^\]]+)\]\s*(.*)$/),meta=m?m[2]:'';return{ref:m?m[1]:first,meta:(meta.match(/\(Translation:\s*([^)]+)\)/)||[])[1]||meta,arabic:(lines.find(x=>x.startsWith('Arabic:'))||'').slice(7).trim(),english:(lines.find(x=>x.startsWith('English:'))||'').slice(8).trim(),type}}
  function sourceCard(raw,type){const s=readSource(raw,type),card=document.createElement('article');card.className='source-card';const top=document.createElement('div');top.className='source-top';const ref=document.createElement('div');ref.className='source-ref';ref.textContent=s.ref;const kind=document.createElement('span');kind.className='source-kind';kind.textContent=type;top.append(ref,kind);card.append(top);if(s.meta){const meta=document.createElement('div');meta.className='source-meta';meta.textContent=s.meta;card.append(meta)}if(s.arabic){const ar=document.createElement('p');ar.className='arabic';ar.lang='ar';ar.dir='rtl';ar.textContent=s.arabic;card.append(ar);const divider=document.createElement('div');divider.className='divider';card.append(divider)}if(s.english){const en=document.createElement('p');en.className='english';en.textContent=s.english;card.append(en)}return card}
  function sourceGroup(name,items){const wrap=document.createElement('div'),head=document.createElement('div'),title=document.createElement('h3'),count=document.createElement('span');wrap.className='source-group';head.className='group-head';title.textContent=name;count.className='group-count';count.textContent=String(items.length);head.append(title,count);wrap.append(head);if(items.length){const list=document.createElement('div');list.className='source-list';items.forEach(x=>list.append(sourceCard(x,name.toLowerCase())));wrap.append(list)}else{const empty=document.createElement('div');empty.className='empty';empty.textContent='No matching references';wrap.append(empty)}return wrap}
  function renderSources(data){const section=document.createElement('section'),head=document.createElement('div'),title=document.createElement('h2'),total=document.createElement('span'),grid=document.createElement('div'),q=data.quran||[],h=data.hadith||[];section.className='sources';head.className='sources-title';title.textContent='Retrieved sources';total.className='source-total';total.textContent=`${q.length+h.length} references`;grid.className='source-groups';grid.append(sourceGroup('Quran',q),sourceGroup('Hadith',h));head.append(title,total);section.append(head,grid);return section}
  function render(data){result.replaceChildren();result.hidden=false;const header=document.createElement('div'),titleWrap=document.createElement('div'),title=document.createElement('h2'),badge=document.createElement('span'),actions=document.createElement('div'),copy=document.createElement('button');header.className='result-head';titleWrap.className='result-title';title.textContent='Answer';badge.className='badge';badge.textContent=data.generated?'Generated':'Sources only';titleWrap.append(title,badge);actions.className='actions';copy.className='quiet';copy.type='button';copy.textContent='Copy answer';copy.onclick=async()=>{try{await navigator.clipboard.writeText(data.answer||'');notify('Answer copied')}catch(_){notify('Clipboard unavailable')}};actions.append(copy);header.append(titleWrap,actions);result.append(header);if(data.legacy||!data.generated){const warning=document.createElement('div');warning.className='warning';warning.textContent=data.legacy?'This older question was saved without its response.':'The local language model is unavailable. Retrieved references are shown below.';result.append(warning)}const q=document.createElement('p');q.className='result-question';q.textContent=data.query;const panel=document.createElement('div'),text=document.createElement('div');panel.className='answer-panel';text.className='answer';text.innerHTML=answerMarkup(data.answer);panel.append(text);result.append(q,panel,renderSources(data));const note=document.createElement('p');note.className='notice';note.textContent='AI summaries can misstate or misattribute claims. Verify each citation against the retrieved source text below; translations and Hadith grading can vary by source and edition.';result.append(note)}
  async function ask(query=input.value.trim()){if(!query||submit.disabled)return;input.value=query;activeConversationId=null;submit.disabled=true;submit.querySelector('span:first-child').textContent='Searching';result.hidden=false;result.innerHTML=`<p class="result-question">${esc(query)}</p><div class="loading"><span class="spinner" aria-hidden="true"></span><span>Searching indexed sources and composing an answer…</span></div>`;try{const requestedMode=mode,r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,mode:requestedMode})}),data=await r.json();if(!r.ok)throw new Error(data.error||'Search request failed.');data.mode=requestedMode;saveConversation(data);render(data);result.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){result.innerHTML=`<div class="warning">${esc(e.message||'Could not reach local search server.')}</div>`}finally{submit.disabled=false;submit.querySelector('span:first-child').textContent='Ask';status()}}
  document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.setAttribute('aria-pressed',String(x===b))) });
  document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;input.focus()});
  sidebarToggle.onclick=()=>setSidebarOpen(!sidebar.classList.contains('is-open'));
  sidebarBackdrop.onclick=()=>setSidebarOpen(false);
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&sidebar.classList.contains('is-open')){setSidebarOpen(false);sidebarToggle.focus()}});
  compactLayout.addEventListener('change',event=>{if(!event.matches)setSidebarOpen(false);else setSidebarOpen(false)});
  form.onsubmit=e=>{e.preventDefault();ask()};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}};
  setSidebarOpen(false);renderHistory();status();setInterval(status,30000);
})();
</script>
